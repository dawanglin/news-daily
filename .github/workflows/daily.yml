name: Daily News Digest

# 北京时间 17:07 至 23:07 每小时巡检，给 GitHub 定时任务留出多次补跑机会。
# 首次成功抓取后当天快照固定；后续巡检只重新构建/发布，不覆盖数据。
# 任何代码推送也会执行抓取与发布，避免“流程成功但数据仍旧”的假绿灯。
on:
  push:
    branches: [main]
  schedule:
    - cron: "7 9-15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取新闻
        env:
          # 定时任务晚到时也生成当前日期快照，避免卡在 17:00 门槛后整晚不更新。
          NOT_BEFORE_HOUR: ${{ github.event_name == 'schedule' && '17' || '0' }}
        run: python fetch_news.py

      - name: 生成静态站点
        run: python build_site.py

      - name: 提交当天数据与站点
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "chore: 更新 $(date +%F) 新闻速览"
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
