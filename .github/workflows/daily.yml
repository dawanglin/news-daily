name: Daily News Digest

# 北京时间 22:00 与 23:00 巡检：22:00 主发，23:00 兜底补跑，落在 22-23 点窗口。
# 当天快照首次成功生成后固定保留；后续巡检不会覆盖历史数据。
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14-15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取新闻
        if: github.event_name != 'push'
        run: python fetch_news.py

      - name: 确认今日快照存在
        if: github.event_name != 'push'
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          test -s "data/news_${today}.json" || { echo "::error::未生成今日新闻快照，停止发布旧页面"; exit 1; }

      - name: 生成静态站点
        run: python build_site.py

      - name: 提交当天数据与站点
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "chore: 更新 $(date +%F) 新闻速览"
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
