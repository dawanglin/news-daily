name: Daily News Digest

# 北京时间 09:07 至 23:07 每两小时巡检一次。
# 抓取程序在 17:00 前自动跳过；当天快照一旦存在，后续巡检不会重抓或改写。
# 多次巡检用于抵抗 GitHub 定时任务数小时级延迟或偶发丢失。
on:
  push:
    branches: [main]
  schedule:
    - cron: "7 1,3,5,7,9,11,13,15 * * *"
  workflow_dispatch: {}   # 也支持在 Actions 页面手动触发

permissions:
  contents: write   # 提交生成的 data/ 和 site/
  pages: write      # 部署到 GitHub Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取新闻（纯标准库，无需安装依赖）
        if: github.event_name != 'push'
        env:
          NOT_BEFORE_HOUR: ${{ github.event_name == 'schedule' && '17' || '0' }}
        run: python fetch_news.py

      - name: 生成静态站点
        run: python build_site.py

      - name: 提交当天数据与站点
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "chore: 更新 $(date +%F) 新闻速览"
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
